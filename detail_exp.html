<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <script>
    (function () { var s; try { s = localStorage.getItem("portorio-theme"); } catch (e) { } var t = s === "dark" || s === "light" ? s : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); document.documentElement.dataset.theme = t; document.querySelector('meta[name="theme-color"]').content = t === "dark" ? "#0b0b0b" : "#ffffff"; })();
  </script>
  <meta name="description"
    content="Experience notes from Rio Rasyha Syadzily's developer discography: the competitions, organizations, and teams behind the work, with documentation.">

  <title>Experience Details | RIO</title>
  <link rel="icon" href="assets/record.svg" type="image/svg+xml">

  <!-- Cache-busting: when you publish CSS/JS changes, change every ?v=20261125 on this page
       (and in detail_PJ.html / detail_exp.html) to a new value, e.g. today's date. -->
  <link rel="stylesheet" href="css/theme.css?v=20261125">
  <link rel="stylesheet" href="css/detail-base.css?v=20261125">
  <link rel="stylesheet" href="css/detail.css?v=20261125">
  <link rel="stylesheet" href="css/playback.css?v=20261125">
</head>

<body>
  <a class="skip-link" href="#experience-content">Skip to experience notes</a>

  <nav aria-label="Experience navigation">
    <div class="container nav-inner">
      <a href="index.html" class="logo">
        <img src="assets/record.svg" width="29" height="29" alt="">PortoRio
      </a>
      <div class="nav-actions">
        <a href="index.html#experience" class="back-button">
          Back to Experience
        </a>
        <button type="button" class="theme-toggle" data-theme-toggle aria-label="Dark theme" aria-pressed="false" title="Toggle dark theme" hidden><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 1.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/><circle class="disc-dot" cx="10" cy="10" r="2.2"/></svg></button>
      </div>
    </div>
  </nav>

  <header class="project-hero">
    <div class="container">
      <div class="project-category" id="experienceCategory">Experience</div>
      <h1 id="experienceTitle">Experience</h1>
      <p class="project-subtitle" id="experienceSubtitle"></p>
    </div>
  </header>

  <main class="container" id="experience-content" tabindex="-1">
    <div class="detail-playback" id="detail-playback" aria-label="Experience soundtrack" hidden>
      <svg class="audio-spectrum" data-spectrum viewBox="0 0 240 48" aria-hidden="true" focusable="false"></svg>
      <div class="playback-buttons"><button class="playback-button" type="button" data-play aria-label="Play record"
          aria-pressed="false">&#9654; Play</button><button class="playback-button" id="stop-record" type="button"
          data-stop aria-label="Stop record">&#9632; Stop</button><button class="playback-button" type="button"
          data-retry hidden>Retry soundtrack</button></div>
      <p class="audio-status" data-audio-status role="status" aria-live="polite">Stopped</p>
    </div>
    <noscript>
      <p class="fallback-note">Enable JavaScript to load these experience notes, or <a
          href="index.html#experience">read the summaries in the collection</a>.</p>
    </noscript>

    <div class="project-layout">
      <div class="project-main">
        <section class="detail-section">
          <h2>Overview</h2>
          <p id="experienceOverview"></p>
        </section>

        <section class="detail-section" id="experienceHighlightsSection" hidden>
          <h2>Highlights</h2>
          <ul class="features-list" id="experienceHighlights"></ul>
        </section>

        <section class="detail-section">
          <h2>Documentation</h2>
          <div class="screenshots-grid proof-grid" id="experienceProof"></div>
        </section>
      </div>

      <aside class="project-sidebar">
        <div class="sidebar-card">
          <h3>Session Information</h3>
          <div class="sidebar-item">
            <div class="sidebar-label">Organization</div>
            <div class="sidebar-value" id="sidebarOrganization"></div>
          </div>
          <div class="sidebar-item">
            <div class="sidebar-label">Role</div>
            <div class="sidebar-value" id="sidebarRole"></div>
          </div>
          <div class="sidebar-item">
            <div class="sidebar-label">Period</div>
            <div class="sidebar-value" id="sidebarPeriod"></div>
          </div>
          <div class="project-links" id="experienceLinks"></div>
        </div>
      </aside>
    </div>
  </main>

  <footer>
    <div class="container">
      © <span id="year">2026</span> Rio Rasyha Syadzily. Made of curiosity. Pressed in code.
    </div>
  </footer>

  <script src="js/app.js?v=20261125"></script>
</body>

</html>
